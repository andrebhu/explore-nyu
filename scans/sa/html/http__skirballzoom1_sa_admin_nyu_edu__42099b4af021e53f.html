<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial, Helvetica, sans-serif;}

/* The Modal (background) */
.modal {
  display: none; /* Hidden by default */
  position: fixed; /* Stay in place */
  z-index: 1; /* Sit on top */
  padding-top: 100px; /* Location of the box */
  left: 0;
  top: 0;
  width: 100%; /* Full width */
  height: 100%; /* Full height */
  overflow: auto; /* Enable scroll if needed */
  background-color: rgb(0,0,0); /* Fallback color */
  background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
}

/* Modal Content */
.modal-content {
  position: relative;
  background-color: #fefefe;
  margin: auto;
  padding: 0;
  border: 1px solid #888;
  width: 30%;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2),0 6px 20px 0 rgba(0,0,0,0.19);
  -webkit-animation-name: animatetop;
  -webkit-animation-duration: 0.4s;
  animation-name: animatetop;
  animation-duration: 0.4s;
  margin-bottom:10em;
}

/* Add Animation */
@-webkit-keyframes animatetop {
  from {top:-300px; opacity:0} 
  to {top:0; opacity:1}
}

@keyframes animatetop {
  from {top:-300px; opacity:0}
  to {top:0; opacity:1}
}

/* The OK Button */
.button {
  background-color:#008CBA;
  border: none;
  color: white;
  padding: 7px 25px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  float: right;
}

.modal-header {
  padding: 2px 16px;
  color: white;
}

.modal-body {padding: 20px 16px 2px 16px;}

.modal-footer {
  padding: 10px 16px 6px 0px;
  color: white;
  height:45px;
}

p {
  display: block;
  margin: 0.5em 0em;
  overflow-wrap: break-word;
}

pre{
  white-space:pre;
  white-space: pre-wrap;       /* css-3 */
  white-space: -moz-pre-wrap;  /* Mozilla, since 1999 */
  white-space: -pre-wrap;      /* Opera 4-6 */
  white-space: -o-pre-wrap;    /* Opera 7 */
  word-wrap: break-word;       /* Internet Explorer 5.5+ */
  font-family: Arial, Helvetica, sans-serif;
}
</style>
</head>
<body>

<div id="myModal" class="modal">

  <!-- Modal content -->
  <div class="modal-content">
    <div class="modal-body">
	<p id="defaultTextDisplay"></p>
	<pre id="bannerTextDisplay"></pre>
    </div>
    <div class="modal-footer">
      <button class="button" id="okBtn">OK</button>
    </div>
  </div>

</div>
<script src="scripts.js"></script>
<script>
// Get the modal
var modal = document.getElementById("myModal");

// Get the button that opens the modal
var btn2 = document.getElementById("okBtn");

var bannerTextDisplay = document.getElementById("bannerTextDisplay");
var defaultTextDisplay = document.getElementById("defaultTextDisplay");

var redirectUrl = "index_device.html"; 
var isAirmediaEnabled = false;
btn2.onclick = function() {
  modal.style.display = "none";
  window.location.href= redirectUrl;
}

window.onload = function() {
modal.style.display = "none";
var ip = window.location.hostname;
defaultTextDisplay.textContent  = "The device at "+ ip + "  has sent the following logon banner:  ";

var client = new HttpClient();
getbannerFileContent();
getbannerData();

function getbannerFileContent() {
            var jqxhr = $.get( '/banner.txt', function(response) {
                var bannerText = response.trim();
                bannerTextDisplay.textContent = bannerText.toString();
                })
                .fail(function() {
                  bannerTextDisplay.textContent ="It is strongly suggested this device be configured as per the secure deployment guide in order to provide the greatest security."
                });

		}

function getbannerData(){
	client.get('/bannercontents.txt', function(response) {
		// do something with response
		console.log(response)
		if(response.trim() != "") {
      var displaybanner = false;
		var responseData = response.trim().split("\n");
		for(i=0;i<responseData.length;i++){ 
      if(responseData[i].match(/displaybanner/g)){
        var displaybannerdata = responseData[i].split(":");
        if(displaybannerdata[1] == 0){
			window.location.href= redirectUrl;
			}
		}
		if(responseData[i].match(/airmedia/g)){
			var airmediadata = responseData[i].split(":");
				if(airmediadata[1].trim() == "" || airmediadata[1] == 'disabled')
				  redirectUrl= "/index_device.html"
				 else
				 redirectUrl = "/index_device.html"
		}		
      }
      
      if(displaybannerdata && displaybannerdata[1] == 1){
        modal.style.display = "block"; 
      }
	}
	});
}
}
try{
var HttpClient = function() {
    this.get = function(aUrl, aCallback) {
        var anHttpRequest = new XMLHttpRequest();
        anHttpRequest.onreadystatechange = function() { 
            if (anHttpRequest.readyState == 4 && anHttpRequest.status == 200)
                aCallback(anHttpRequest.responseText);
			else if(anHttpRequest.status == 404){
				 isAirmediaEnabled = false;
			}
        }

        anHttpRequest.open( "GET", aUrl, true );            
        anHttpRequest.send();
    }
}
}catch(e){
		console.log(e);
}




</script>
</body>
</html>
