   <!DOCTYPE HTML>
<HTML>
<HEAD>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

<TITLE>Cisco Systems Login</TITLE>

<META http-equiv=Content-Type content="text/html; charset=utf-8">
<meta charset="UTF-8">
<link rel="stylesheet" href="css/icon_styles_ciscologo.css">
<link rel="stylesheet" href="css/login.css">
<STYLE type=text/css>
.logintitle {
	FONT-WEIGHT: bold; FONT-SIZE: 12px; COLOR: #ffffff; FONT-FAMILY: Verdana, Arial, Helvetica, sans-serif
}
.login {
	FONT-WEIGHT: normal; FONT-SIZE: 11px; COLOR: #ffffff; FONT-FAMILY: Verdana, Arial, Helvetica, sans-serif
}
.style1 {
	font-family: Verdana, Arial, Helvetica, sans-serif;
	font-weight: bold;
}
TEXTAREA.area{
        COLOR: #4682B4;
        BACKGROUND-COLOR: #FFFFFF;
}
span.copyright {
	font-family: Arial, Helvetica, sans-serif;
	font-size: 12px;
        font-weight: bold;
        text-align: left;
	color: #999999;
}
</STYLE>
<script type="text/javascript" src="javascript/jquery.min.js?ver=8.10.151.0"></script>
<script src="javascript/angular-1.7.9/angular.min.js?ver=8.10.151.0"></script>
<script src="javascript/angular-1.7.9/angular-route.min.js?ver=8.10.151.0"></script>
<script src="javascript/controllers/rfdashboard.js?ver=8.10.151.0"></script>
<script src="javascript/translate.js?ver=8.10.151.0"></script>
<script>

	function replaceSpaceHTML(str) {
		var retVal = str;
		if ((typeof retVal === 'string')|| (retVal instanceof String)) {
			var lines = retVal.split('\n');
			retVal = "";
			for(var i = 0;i < lines.length;i++) {
				var newStr = lines[i].trim();
				retVal += newStr.replace(/\t/g, '').replace(/ /g, '&nbsp;').replace(/\r/g, '') + "<br \>";
			}
		}
		return retVal;
	}
	function loginAction(){
		document.location.href="screens/preframeset.html";
	}
	window.onload = function () {
		if(document.getElementById("loginBanner") !== null){
			document.getElementById("banner").innerHTML = replaceSpaceHTML(document.getElementById("loginBanner").value);
		}
		var message = "";

	  message = "2005 - ";

		document.getElementById("copyrightYear").innerHTML = "&copy "+ message + document.getElementById("systemtime").value;
	}
</SCRIPT>
<META content="MSHTML 6.00.2900.2180" name=GENERATOR>
</HEAD>
<BODY text=#000000 leftMargin=0 topMargin=0 marginwidth="0" marginheight="0" height="100%" ng-app="rfDashboard">
<FORM method="post" ACTION="/main_login.html">
<INPUT id="systemtime" style="display:none" type="TEXT" readonly name="systemtime" SIZE="1" MAXLENGTH="31" VALUE="2022
">
<div class="configLoginScreen" valign="middle" id="loginPage">
	<div class="configLoginScreenContainer">
		<div class="configLoginCompanyLogoWrapper">
			<div class="icon-cisco_logo"  title="{{'login_cisco_logo' | translate }}" id="cisco_logo"></div>
		</div>
		<div class="configProductName">
			{{'login_product_name' | translate }}
		</div>
		<div class="configWelcomeMessage">
			{{'login_welcome_message' | translate }}
		</div>
	   	<p></p>
		<div id="banner" class="configWelcomeMessage"></div>
		<div class="configLoginFields">
			<BUTTON class="k-button" name="bSubmit " onclick="loginAction()" type="button">{{'login_action_login' | translate }}</button>
		</div>
                <div id="copyrightmessage" class="configLoginCopyright">
			<span id="copyrightYear"></span>
			{{'login_copyrights_latest' | translate}}
		</div>
	</div>
</div>

</FORM>
</BODY></HTML>
